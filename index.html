<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 이 사이트 파일과 Google Fonts 외에는 불러오거나 실행하지 않는다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>CPPG 기출 마스터</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='%2338bdf8' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/pdfjs/pdf.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="logo">CPPG MASTER</div>
      <ul class="nav-links">
        <li data-view="dashboard">📊 대시보드</li>
        <li data-view="select">📝 기출 풀기</li>
        <li data-view="bookmarks">⭐ 다시 볼 문제</li>
        <li data-view="stats">📈 학습 통계</li>
        <li data-view="settings">⚙️ 설정</li>
      </ul>
      <div class="sidebar-foot" id="data-status"></div>
    </aside>

    <main class="content" id="content"></main>
  </div>

  <!-- 다이얼로그 (확인/입력/알림) -->
  <div id="dialog" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h3 id="dialog-title"></h3>
      <div id="dialog-body"></div>
      <div id="dialog-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- 원본 페이지 라이트박스 -->
  <div id="lightbox" hidden>
    <div class="lightbox-bar">
      <span id="lightbox-title"></span>
      <span class="lightbox-tools">
        <button class="ghost-btn" data-lb="prev" title="이전 페이지">‹</button>
        <button class="ghost-btn" data-lb="next" title="다음 페이지">›</button>
        <button class="ghost-btn" data-lb="zoom-out" title="축소">−</button>
        <button class="ghost-btn" data-lb="zoom-in" title="확대">＋</button>
        <button class="ghost-btn" data-lb="close" title="닫기 (Esc)">✕</button>
      </span>
    </div>
    <div id="lightbox-stage"><canvas id="lightbox-canvas"></canvas></div>
  </div>

  <script src="js/parser.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
